services:
  quality-bar:
    image: quality-bar:${QUALITY_BAR_VERSION:?QUALITY_BAR_VERSION must be set}
    platform: linux/amd64
    build:
      context: .
      args:
        QUALITY_BAR_VERSION: ${QUALITY_BAR_VERSION:?QUALITY_BAR_VERSION must be set}
    user: "10001:10001"
    restart: unless-stopped
    ports:
      - "127.0.0.1:${QUALITY_BAR_HTTP_PORT:-3000}:3000"
