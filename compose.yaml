services:
  quality-bar:
    image: quality-bar:${QUALITY_BAR_VERSION:?QUALITY_BAR_VERSION must be set}
    platform: linux/amd64
    build:
      context: .
      args:
        QUALITY_BAR_VERSION: ${QUALITY_BAR_VERSION:?QUALITY_BAR_VERSION must be set}
    user: "10001:10001"
    restart: unless-stopped
    network_mode: host
    environment:
      QUALITY_BAR_HTTP_PORT: ${QUALITY_BAR_HTTP_PORT:-3000}
    volumes:
      - quality-bar-state:/var/lib/quality-bar
      - quality-bar-checkouts:/var/cache/quality-bar/checkouts
      - quality-bar-backups:/var/backups/quality-bar
      - type: bind
        source: ${QUALITY_BAR_CONFIG_FILE:?QUALITY_BAR_CONFIG_FILE must be set}
        target: /etc/quality-bar/config.env
        read_only: true
      - type: bind
        source: ${QUALITY_BAR_MASTER_KEY_FILE:?QUALITY_BAR_MASTER_KEY_FILE must be set}
        target: /run/secrets/quality-bar-master-key
        read_only: true

volumes:
  quality-bar-state:
  quality-bar-checkouts:
  quality-bar-backups:
