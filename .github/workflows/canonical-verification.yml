name: Canonical verification

on:
  pull_request: {}
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Canonical verification
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out complete trusted history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up exact Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up exact Firefox
        id: firefox
        uses: browser-actions/setup-firefox@0bc507ddf224827e3b1af68e014d5e42ab93e795 # v1.7.2
        with:
          firefox-version: "153.0"

      - name: Install locked dependencies
        run: npm ci

      - name: Confirm verification prerequisites
        run: |
          test "$(uname -m)" = "x86_64"
          docker version
          docker compose version
          docker run --rm --platform linux/amd64 --cpus 4 --memory 8589934592 node:24.18.0-alpine@sha256:4ba75f835bb8802193e4c114572113d4b26f95f6f094f4b5229d2a77773e0afc node --version
          firefox --version
          sudo sysctl --write kernel.apparmor_restrict_unprivileged_userns=0
          test "$(sysctl --values kernel.apparmor_restrict_unprivileged_userns)" = "0"

      - name: Run canonical verification
        run: npm run verify
        env:
          QUALITY_BAR_FIREFOX_BINARY: ${{ steps.firefox.outputs.firefox-path }}

      - name: Preserve canonical verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: canonical-verification-evidence
          path: artifacts/verification/evidence.json
          if-no-files-found: error
