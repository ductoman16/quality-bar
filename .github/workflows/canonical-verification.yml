name: CI

on:
  pull_request: {}
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  ci:
    name: CI
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out complete trusted history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up exact Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up exact Firefox
        id: firefox
        uses: browser-actions/setup-firefox@0bc507ddf224827e3b1af68e014d5e42ab93e795 # v1.7.2
        with:
          firefox-version: "153.0"

      - name: Install locked dependencies
        run: npm ci

      - name: Confirm verification prerequisites
        run: |
          test "$(uname -m)" = "x86_64"
          docker version
          docker compose version
          firefox --version
          sudo sysctl --write kernel.apparmor_restrict_unprivileged_userns=0
          test "$(sysctl --values kernel.apparmor_restrict_unprivileged_userns)" = "0"

      - name: Check formatting
        run: npm run format:check

      - name: Build operator UI
        run: npm run build

      - name: Check source structure
        run: npm run lint:structure

      - name: Check JavaScript correctness
        run: npm run lint:correctness

      - name: Check Node boundaries
        run: npm run lint:boundaries

      - name: Type-check source
        run: npm run typecheck

      - name: Run tests with coverage
        run: npm run coverage
        env:
          QUALITY_BAR_FIREFOX_BINARY: ${{ steps.firefox.outputs.firefox-path }}
