name: CI

on:
  pull_request: {}
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  ci:
    name: CI
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out complete trusted history
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Set up exact Node runtime
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up exact Firefox
        id: firefox
        uses: browser-actions/setup-firefox@0bc507ddf224827e3b1af68e014d5e42ab93e795 # v1.7.2
        with:
          firefox-version: "153.0"

      - name: Install locked dependencies
        run: npm ci

      - name: Confirm verification prerequisites
        run: |
          test "$(uname -m)" = "x86_64"
          docker version
          docker compose version
          firefox --version
          sudo sysctl --write kernel.apparmor_restrict_unprivileged_userns=0
          test "$(sysctl --values kernel.apparmor_restrict_unprivileged_userns)" = "0"

      - name: Check formatting
        run: npm run format:check

      - name: Check source structure
        run: npm run lint:structure

      - name: Check JavaScript correctness
        run: npm run lint:correctness

      - name: Check Node boundaries
        run: npm run lint:boundaries

      - name: Type-check Node source
        run: npm run typecheck:node

      - name: Type-check browser source
        run: npm run typecheck:browser

      - name: Type-check tests
        run: npm run typecheck:tests

      - name: Type-check scripts
        run: npm run typecheck:scripts

      - name: Run tests with coverage
        run: npm run coverage
        env:
          QUALITY_BAR_FIREFOX_BINARY: ${{ steps.firefox.outputs.firefox-path }}

      - name: Validate OpenAPI
        run: npm run openapi:check
